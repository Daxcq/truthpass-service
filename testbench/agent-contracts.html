<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TruthPass Agent 合同测试台</title>
<style>
:root{--navy:#0f172a;--blue:#1e40af;--soft:#dbeafe;--muted:#475569;--line:#cbd5e1;--bg:#f8fafc;--green:#047857;--green-bg:#d1fae5;--red:#b91c1c;--red-bg:#fee2e2;font-family:"Fira Sans","Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy)}main{max-width:1200px;margin:0 auto;padding:30px 20px 56px}header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}h1,h2,p{margin-top:0}h1{margin-bottom:8px;letter-spacing:-.03em}h2{font-size:17px;margin-bottom:12px}.eyebrow,pre,code,.mono{font-family:"Fira Code",Consolas,monospace}.eyebrow{font-size:12px;letter-spacing:.1em;font-weight:700;color:var(--blue)}.muted{color:var(--muted);line-height:1.55}.badge{padding:6px 10px;border-radius:99px;background:var(--green-bg);color:var(--green);font:700 12px "Fira Code",Consolas,monospace;white-space:nowrap}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px;box-shadow:0 5px 16px rgb(15 23 42 / 4%)}.bar{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:15px}.field{display:grid;gap:6px;min-width:230px}.field label{font-size:13px;font-weight:700}.field select,textarea{border:1px solid #94a3b8;border-radius:8px;background:white;color:var(--navy);font:13px/1.5 "Fira Code",Consolas,monospace}.field select{height:44px;padding:0 10px}button{min-height:44px;border:0;border-radius:8px;padding:0 13px;background:var(--blue);color:white;font-weight:700;cursor:pointer}button.secondary{background:var(--soft);color:var(--blue)}button:hover{filter:brightness(1.08)}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pane-label{font-size:12px;color:var(--muted);margin-bottom:8px}textarea{width:100%;min-height:390px;padding:12px;resize:vertical;background:var(--navy);color:#dbeafe}pre{margin:0;padding:13px;min-height:92px;background:var(--navy);color:#dbeafe;border-radius:8px;overflow:auto;font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word}.status{margin-top:14px;padding:12px;border-radius:8px;background:#eef2ff;color:#1e3a8a;min-height:46px;line-height:1.5}.status.ok{background:var(--green-bg);color:var(--green)}.status.bad{background:var(--red-bg);color:var(--red)}@media(max-width:800px){header{flex-direction:column}.grid{grid-template-columns:1fr}textarea{min-height:300px}}
</style></head>
<body><main>
<header><div><div class="eyebrow">TRUTHPASS · AGENT CONTRACT TESTBENCH</div><h1>三类业务 Agent 合同测试台</h1><p class="muted">只校验输入/输出 JSON 合同，不执行验收。生产/检测 Agent 提供辅助线索，消费者 Agent 只选择证据卡事实。</p></div><span class="badge">LOCAL TEST · NO API KEY</span></header>
<section class="panel">
<div class="bar"><div class="field"><label for="role">Agent 角色</label><select id="role"><option value="production">生产 Agent</option><option value="inspection">检测 Agent</option><option value="consumer">消费者 Agent</option></select></div><div class="actions"><button id="load" type="button">载入该角色合法样例</button><button class="secondary" id="hallucinate" type="button">注入伪造事实 ID</button><button class="secondary" id="score" type="button">注入 score 字段</button><button id="validate" type="button">验证合同</button></div></div>
<div class="grid"><article><div class="pane-label">由数据层/JEV 构造的 Agent 输入（只读）</div><pre id="input" aria-label="Agent input">载入中…</pre></article><article><div class="pane-label">模拟 Agent 输出（可编辑 JSON）</div><textarea id="output" aria-label="Agent output" spellcheck="false"></textarea></article></div>
<div id="status" class="status" role="status" aria-live="polite">正在连接本地合同校验器…</div><div style="margin-top:14px"><div class="pane-label">校验器返回</div><pre id="result">等待验证</pre></div>
</section></main>
<script>
const roleEl=document.getElementById("role"),inputEl=document.getElementById("input"),outputEl=document.getElementById("output"),statusEl=document.getElementById("status"),resultEl=document.getElementById("result");
let currentSample;
async function loadRole(){statusEl.className="status";statusEl.textContent="读取 JEV 角色输入…";try{const response=await fetch("/api/test/agents/input?role="+encodeURIComponent(roleEl.value));const body=await response.json();if(!response.ok)throw new Error(body.message||body.error);currentSample=body;inputEl.textContent=JSON.stringify(body.input,null,2);outputEl.value=JSON.stringify(body.sampleOutput,null,2);resultEl.textContent="等待验证";statusEl.textContent="样例已载入。注意：消费者购买关联状态只表示 registered_only，不代表购买凭证已独立核验。"}catch(error){statusEl.className="status bad";statusEl.textContent=String(error)}}
function mutateOutput(mutator){try{const value=JSON.parse(outputEl.value);mutator(value);outputEl.value=JSON.stringify(value,null,2)}catch{statusEl.className="status bad";statusEl.textContent="当前输出不是有效 JSON，请先载入样例或修复 JSON。"}}
async function validate(){try{const output=JSON.parse(outputEl.value);const response=await fetch("/api/test/agents/validate",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({role:roleEl.value,output})});const body=await response.json();resultEl.textContent=JSON.stringify(body,null,2);statusEl.className=response.ok?"status ok":"status bad";statusEl.textContent=response.ok?"合同有效；输出已规范化。":"合同拒绝："+(body.path ? body.path + " — " : "") + body.message}catch(error){statusEl.className="status bad";statusEl.textContent="输出 JSON 无效："+String(error)}}
roleEl.addEventListener("change",loadRole);document.getElementById("load").addEventListener("click",loadRole);document.getElementById("validate").addEventListener("click",validate);document.getElementById("hallucinate").addEventListener("click",()=>mutateOutput(value=>{if(value.role==="consumer")value.selectedFactIds=["F99"];else if(value.findings?.length)value.findings[0].sourceIds=["ev-fabricated-999"]}));document.getElementById("score").addEventListener("click",()=>mutateOutput(value=>{value.score=100}));loadRole();
</script></body></html>
